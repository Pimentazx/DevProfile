services:
  postgres:
    image: postgres:17-alpine
    container_name: devprofile-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: devprofile
      POSTGRES_USER: devprofile
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - devprofile_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devprofile -d devprofile"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devprofile_postgres_data: